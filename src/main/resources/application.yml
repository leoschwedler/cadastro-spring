spring:
  application:
    name: cadastro-spring
  h2:
    console:
      path: /h2-console
      settings.trace: false
      settings.web-allow-others: false
      enabled: true
  datasource:
    url: jdbc:h2:file:/data/demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;
    username: sa
    password: password
    driverClassName: org.h2.Driver
    initialization: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
